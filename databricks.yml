bundle:
  name: fraud_platform

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace-url>.cloud.databricks.com
    variables:
      catalog: fraud_platform

  prod:
    mode: production
    workspace:
      host: https://<your-workspace-url>.cloud.databricks.com
    variables:
      catalog: fraud_platform
